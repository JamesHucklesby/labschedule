services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: labschedule_db
    user: root
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calendar}
      POSTGRES_USER: ${POSTGRES_USER:-calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - /zs/labschedule/postgresql:/var/lib/postgresql
    ports:
      - "54311:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendar} -d ${POSTGRES_DB:-calendar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-calendar}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-calendar}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/callback}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-1}
      BACKUP_POSTGRES_HOST: db
      BACKUP_POSTGRES_PORT: 5432
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - /zs/labschedule/backups:/app/backups
    ports:
      - "8088:777"
    networks:
      - web

networks:
  web:
    external: true
