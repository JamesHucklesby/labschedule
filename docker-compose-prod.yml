services:

 # To deploy run docker compose --file docker-compose-prod.yml  up -d

  db:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
    restart: unless-stopped
    container_name: labschedule_db
    user: root
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calendar}
      POSTGRES_USER: ${POSTGRES_USER:-calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - /zs/labschedule/postgresql:/var/lib/postgresql
    env_file:
      - .env.prod
    ports:
      - "54311:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendar} -d ${POSTGRES_DB:-calendar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: labschedule_app
    depends_on:
      db:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BACKUP_POSTGRES_HOST: db
      BACKUP_POSTGRES_PORT: 5432
    volumes:
      - /zs/labschedule/backups:/app/backups
    ports:
      - "${APP_PORT:-8088}:777"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:777/', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - web

networks:
  web:
    external: true
